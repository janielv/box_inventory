<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="箱子清单">
<meta name="theme-color" content="#F9FAFB">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>箱子清单</title>
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif; background: #F9FAFB; overscroll-behavior: none; }
  input, select { font-size: 16px !important; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const LOCATIONS = ["客厅", "卧室", "厨房", "车库", "储物间", "阁楼", "阳台", "书房", "其他"];
const STORAGE_KEY = "box-inventory-v1";
const genId = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

const compressImage = (file) =>
  new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const maxW = 300;
        const scale = Math.min(1, maxW / img.width);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.5));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) { console.error("Save failed:", e); }
}

const defaultData = () => ({ boxes: [], lastBackup: null, changesSinceBackup: 0 });

// ——— Icons ———
const BoxIcon = () => (
  <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.8"><path strokeLinecap="round" strokeLinejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
);
const SearchIcon = () => (
  <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.8"><circle cx="11" cy="11" r="7"/><path strokeLinecap="round" d="M21 21l-4.35-4.35"/></svg>
);
const BackupIcon = () => (
  <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.8"><path strokeLinecap="round" strokeLinejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
);
const PlusIcon = () => (
  <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.2"><path strokeLinecap="round" d="M12 5v14m-7-7h14"/></svg>
);
const ChevronRight = () => (
  <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" d="M9 5l7 7-7 7"/></svg>
);
const ArrowLeft = () => (
  <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" d="M15 19l-7-7 7-7"/></svg>
);
const CameraIcon = () => (
  <svg width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.5"><path strokeLinecap="round" strokeLinejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><circle cx="12" cy="13" r="3"/></svg>
);
const TrashIcon = () => (
  <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.8"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
);
const MoveIcon = () => (
  <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.8"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
);
const EditIcon = () => (
  <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.8"><path strokeLinecap="round" strokeLinejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
);
const CheckIcon = () => (
  <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>
);
const XIcon = ({ size = 20 }) => (
  <svg width={size} height={size} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" d="M6 18L18 6M6 6l12 12"/></svg>
);
const LinkIcon = () => (
  <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.8"><path strokeLinecap="round" strokeLinejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
);

// Toast
function Toast({ message, type = "info", onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 2500); return () => clearTimeout(t); }, [onClose]);
  const bg = type === "error" ? "#EF4444" : type === "success" ? "#10B981" : "#3B82F6";
  return (
    <div style={{ position:"fixed",top:56,left:16,right:16,zIndex:999,background:bg,color:"#fff",padding:"12px 16px",borderRadius:12,fontSize:14,fontWeight:500,textAlign:"center",boxShadow:"0 4px 20px rgba(0,0,0,0.15)",animation:"slideDown 0.25s ease" }}>
      {message}
    </div>
  );
}

// Modal
function Modal({ children, onClose, title }) {
  return (
    <div style={{ position:"fixed",inset:0,zIndex:100,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"flex-end",justifyContent:"center" }} onClick={onClose}>
      <div style={{ background:"#fff",borderRadius:"20px 20px 0 0",width:"100%",maxHeight:"85vh",overflow:"auto",padding:"20px 20px 32px",animation:"slideUp 0.25s ease" }} onClick={e=>e.stopPropagation()}>
        <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16 }}>
          <h3 style={{ fontSize:18,fontWeight:700,color:"#1F2937" }}>{title}</h3>
          <button onClick={onClose} style={{ background:"#F3F4F6",border:"none",borderRadius:20,width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer" }}><XIcon size={16}/></button>
        </div>
        {children}
      </div>
    </div>
  );
}

// Confirm
function Confirm({ message, onYes, onNo }) {
  return (
    <div style={{ position:"fixed",inset:0,zIndex:200,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",padding:24 }}>
      <div style={{ background:"#fff",borderRadius:16,padding:24,maxWidth:320,width:"100%" }}>
        <p style={{ fontSize:15,color:"#374151",marginBottom:20,lineHeight:1.5 }}>{message}</p>
        <div style={{ display:"flex",gap:12 }}>
          <button onClick={onNo} style={{ flex:1,padding:"10px",borderRadius:10,border:"1px solid #E5E7EB",background:"#fff",fontSize:15,fontWeight:500,cursor:"pointer",color:"#374151" }}>取消</button>
          <button onClick={onYes} style={{ flex:1,padding:"10px",borderRadius:10,border:"none",background:"#EF4444",color:"#fff",fontSize:15,fontWeight:500,cursor:"pointer" }}>确认</button>
        </div>
      </div>
    </div>
  );
}

// ===== MAIN APP =====
function App() {
  const [data, setData] = useState(() => loadData() || defaultData());
  const [tab, setTab] = useState("boxes");
  const [selectedBox, setSelectedBox] = useState(null);
  const [toast, setToast] = useState(null);
  const [locationFilter, setLocationFilter] = useState("全部");
  const [showAddBox, setShowAddBox] = useState(false);
  const [showAddItem, setShowAddItem] = useState(false);
  const [editingBox, setEditingBox] = useState(null);
  const [showMoveModal, setShowMoveModal] = useState(null);
  const [batchMode, setBatchMode] = useState(false);
  const [batchSelected, setBatchSelected] = useState(new Set());
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [viewPhoto, setViewPhoto] = useState(null);
  const [searchQuery, setSearchQuery] = useState("");

  // NFC deep link: read hash on load
  useEffect(() => {
    const handleHash = () => {
      const hash = window.location.hash;
      if (hash.startsWith("#box-")) {
        const boxId = hash.slice(5);
        const d = loadData() || defaultData();
        if (d.boxes.some(b => b.id === boxId)) {
          setSelectedBox(boxId);
          setTab("boxes");
        }
      }
    };
    handleHash();
    window.addEventListener("hashchange", handleHash);
    return () => window.removeEventListener("hashchange", handleHash);
  }, []);

  const persist = useCallback((newData) => {
    const updated = { ...newData, changesSinceBackup: (newData.changesSinceBackup || 0) + 1 };
    setData(updated);
    saveData(updated);
    return updated;
  }, []);

  const showToast = (message, type = "info") => setToast({ message, type });

  // Warn on leave if unsaved
  useEffect(() => {
    const handler = (e) => {
      if (data.changesSinceBackup >= 5) { e.preventDefault(); e.returnValue = ""; }
    };
    window.addEventListener("beforeunload", handler);
    return () => window.removeEventListener("beforeunload", handler);
  }, [data.changesSinceBackup]);

  const backupWarning = data.changesSinceBackup >= 5;
  const currentBox = selectedBox ? data.boxes.find(b => b.id === selectedBox) : null;

  // Handlers
  const addBox = (name, location) => {
    if (data.boxes.some(b => b.name === name)) { showToast("箱子名称已存在，请换一个", "error"); return false; }
    const box = { id: genId(), name, location, items: [], createdAt: Date.now() };
    persist({ ...data, boxes: [...data.boxes, box] });
    showToast(`「${name}」已创建`, "success");
    return true;
  };

  const renameBox = (id, newName) => {
    if (data.boxes.some(b => b.name === newName && b.id !== id)) { showToast("箱子名称已存在，请换一个", "error"); return false; }
    persist({ ...data, boxes: data.boxes.map(b => b.id === id ? { ...b, name: newName } : b) });
    showToast("已重命名", "success");
    return true;
  };

  const updateBoxLocation = (id, location) => {
    persist({ ...data, boxes: data.boxes.map(b => b.id === id ? { ...b, location } : b) });
  };

  const deleteBox = (id) => {
    const box = data.boxes.find(b => b.id === id);
    if (box?.items.length > 0) { showToast("请先清空箱子里的物品", "error"); return; }
    persist({ ...data, boxes: data.boxes.filter(b => b.id !== id) });
    setSelectedBox(null);
    showToast("箱子已删除", "success");
  };

  const addItem = (boxId, name, photo) => {
    const item = { id: genId(), name, photo, createdAt: Date.now() };
    persist({ ...data, boxes: data.boxes.map(b => b.id === boxId ? { ...b, items: [...b.items, item] } : b) });
    showToast(`「${name}」已添加`, "success");
  };

  const deleteItem = (boxId, itemId) => {
    persist({ ...data, boxes: data.boxes.map(b => b.id === boxId ? { ...b, items: b.items.filter(i => i.id !== itemId) } : b) });
    showToast("物品已删除", "success");
  };

  const moveItems = (fromBoxId, itemIds, toBoxId) => {
    const fromBox = data.boxes.find(b => b.id === fromBoxId);
    const movingItems = fromBox.items.filter(i => itemIds.includes(i.id));
    const newBoxes = data.boxes.map(b => {
      if (b.id === fromBoxId) return { ...b, items: b.items.filter(i => !itemIds.includes(i.id)) };
      if (b.id === toBoxId) return { ...b, items: [...b.items, ...movingItems] };
      return b;
    });
    persist({ ...data, boxes: newBoxes });
    const toBox = data.boxes.find(b => b.id === toBoxId);
    showToast(`已移动 ${movingItems.length} 件物品到「${toBox.name}」`, "success");
    setBatchMode(false);
    setBatchSelected(new Set());
  };

  const exportData = () => {
    const exportPayload = { ...data, exportedAt: new Date().toISOString(), version: 1 };
    const blob = new Blob([JSON.stringify(exportPayload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `箱子清单备份_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    const updated = { ...data, lastBackup: Date.now(), changesSinceBackup: 0 };
    setData(updated);
    saveData(updated);
    showToast("备份已导出", "success");
  };

  const importData = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const imported = JSON.parse(e.target.result);
        if (!imported.boxes || !Array.isArray(imported.boxes)) throw new Error();
        const merged = { ...imported, lastBackup: Date.now(), changesSinceBackup: 0 };
        setData(merged);
        saveData(merged);
        setSelectedBox(null);
        showToast(`已恢复 ${merged.boxes.length} 个箱子`, "success");
      } catch { showToast("文件格式不正确", "error"); }
    };
    reader.readAsText(file);
  };

  // NFC link helper
  const getNfcLink = (boxId) => {
    const base = window.location.href.split("#")[0];
    return `${base}#box-${boxId}`;
  };

  const copyNfcLink = (boxId) => {
    const link = getNfcLink(boxId);
    navigator.clipboard.writeText(link).then(
      () => showToast("链接已复制，可写入 NFC 贴纸", "success"),
      () => showToast(link, "info") // fallback: show it
    );
  };

  // Search
  const searchResults = searchQuery.trim()
    ? data.boxes.flatMap(box =>
        box.items.filter(item => item.name.toLowerCase().includes(searchQuery.toLowerCase()))
          .map(item => ({ ...item, boxName: box.name, boxId: box.id, boxLocation: box.location }))
      )
    : [];

  const filteredBoxes = locationFilter === "全部" ? data.boxes : data.boxes.filter(b => b.location === locationFilter);
  const usedLocations = [...new Set(data.boxes.map(b => b.location).filter(Boolean))];

  return (
    <div style={{ background:"#F9FAFB",minHeight:"100vh",paddingBottom:80 }}>
      {toast && <Toast {...toast} onClose={() => setToast(null)} />}
      {viewPhoto && (
        <div style={{ position:"fixed",inset:0,zIndex:300,background:"rgba(0,0,0,0.9)",display:"flex",alignItems:"center",justifyContent:"center" }} onClick={() => setViewPhoto(null)}>
          <img src={viewPhoto} alt="" style={{ maxWidth:"90%",maxHeight:"80vh",borderRadius:8 }} />
        </div>
      )}

      {/* Backup warning */}
      {backupWarning && tab !== "backup" && (
        <div style={{ background:"#FEF3C7",padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:"1px solid #FDE68A" }}>
          <span style={{ fontSize:13,color:"#92400E" }}>已有 {data.changesSinceBackup} 项未备份的改动</span>
          <button onClick={() => setTab("backup")} style={{ background:"#F59E0B",color:"#fff",border:"none",borderRadius:8,padding:"5px 12px",fontSize:12,fontWeight:600,cursor:"pointer" }}>去备份</button>
        </div>
      )}

      {/* ===== TAB: BOXES LIST ===== */}
      {tab === "boxes" && !selectedBox && (
        <div>
          <div style={{ padding:"16px 16px 0",display:"flex",justifyContent:"space-between",alignItems:"center" }}>
            <h1 style={{ fontSize:26,fontWeight:800,color:"#111827",letterSpacing:-0.5 }}>我的箱子</h1>
            <button onClick={() => setShowAddBox(true)} style={{ background:"#3B82F6",color:"#fff",border:"none",borderRadius:12,width:40,height:40,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",boxShadow:"0 2px 8px rgba(59,130,246,0.3)" }}><PlusIcon/></button>
          </div>
          {usedLocations.length > 0 && (
            <div style={{ padding:"12px 16px 0",display:"flex",gap:8,overflowX:"auto",WebkitOverflowScrolling:"touch" }}>
              {["全部", ...usedLocations].map(loc => (
                <button key={loc} onClick={() => setLocationFilter(loc)} style={{
                  background:locationFilter===loc?"#3B82F6":"#fff",color:locationFilter===loc?"#fff":"#6B7280",
                  border:locationFilter===loc?"none":"1px solid #E5E7EB",borderRadius:20,padding:"6px 16px",
                  fontSize:13,fontWeight:500,whiteSpace:"nowrap",cursor:"pointer",flexShrink:0
                }}>{loc}</button>
              ))}
            </div>
          )}
          <div style={{ padding:16,display:"flex",flexDirection:"column",gap:10 }}>
            {filteredBoxes.length === 0 && (
              <div style={{ textAlign:"center",padding:"60px 20px",color:"#9CA3AF" }}>
                <div style={{ fontSize:40,marginBottom:12 }}>📦</div>
                <p style={{ fontSize:15 }}>{data.boxes.length === 0 ? "还没有箱子，点右上角 + 创建" : "当前筛选无结果"}</p>
              </div>
            )}
            {filteredBoxes.map(box => (
              <button key={box.id} onClick={() => { setSelectedBox(box.id); window.location.hash = `box-${box.id}`; }} style={{
                background:"#fff",border:"1px solid #F3F4F6",borderRadius:14,padding:"14px 16px",
                display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",
                textAlign:"left",width:"100%",boxShadow:"0 1px 3px rgba(0,0,0,0.04)"
              }}>
                <div style={{ display:"flex",alignItems:"center",gap:12,minWidth:0 }}>
                  <div style={{ width:42,height:42,borderRadius:11,background:"#EFF6FF",display:"flex",alignItems:"center",justifyContent:"center",color:"#3B82F6",flexShrink:0 }}><BoxIcon/></div>
                  <div style={{ minWidth:0 }}>
                    <div style={{ fontSize:15,fontWeight:600,color:"#1F2937",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{box.name}</div>
                    <div style={{ fontSize:13,color:"#9CA3AF",marginTop:2 }}>{box.items.length} 件物品{box.location ? ` · ${box.location}` : ""}</div>
                  </div>
                </div>
                <ChevronRight/>
              </button>
            ))}
          </div>
          <div style={{ textAlign:"center",padding:"0 16px 16px" }}>
            <p style={{ fontSize:12,color:"#D1D5DB" }}>共 {data.boxes.length} 个箱子 · {data.boxes.reduce((s,b)=>s+b.items.length,0)} 件物品</p>
          </div>
        </div>
      )}

      {/* ===== BOX DETAIL ===== */}
      {tab === "boxes" && currentBox && (
        <BoxDetail
          box={currentBox} allBoxes={data.boxes}
          onBack={() => { setSelectedBox(null); setBatchMode(false); setBatchSelected(new Set()); window.location.hash = ""; }}
          onAddItem={() => setShowAddItem(true)}
          onDeleteItem={(itemId) => setConfirmDelete({ type:"item",boxId:currentBox.id,itemId })}
          onMoveItem={(item) => setShowMoveModal([item])}
          onDeleteBox={() => setConfirmDelete({ type:"box",boxId:currentBox.id })}
          onRename={(newName) => renameBox(currentBox.id, newName)}
          onLocationChange={(loc) => updateBoxLocation(currentBox.id, loc)}
          batchMode={batchMode} setBatchMode={setBatchMode}
          batchSelected={batchSelected} setBatchSelected={setBatchSelected}
          onBatchMove={() => {
            if (batchSelected.size === 0) { showToast("请先选择物品","error"); return; }
            const items = currentBox.items.filter(i => batchSelected.has(i.id));
            setShowMoveModal(items);
          }}
          onViewPhoto={setViewPhoto}
          onCopyNfcLink={() => copyNfcLink(currentBox.id)}
        />
      )}

      {/* ===== TAB: SEARCH ===== */}
      {tab === "search" && (
        <div>
          <div style={{ padding:"16px 16px 0" }}>
            <h1 style={{ fontSize:26,fontWeight:800,color:"#111827",letterSpacing:-0.5,marginBottom:12 }}>搜索物品</h1>
            <input type="text" placeholder="输入物品名称..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} autoFocus
              style={{ width:"100%",padding:"12px 16px",borderRadius:12,border:"1px solid #E5E7EB",background:"#fff",fontSize:16,outline:"none",color:"#1F2937" }} />
          </div>
          <div style={{ padding:16,display:"flex",flexDirection:"column",gap:8 }}>
            {searchQuery.trim() && searchResults.length === 0 && <p style={{ textAlign:"center",color:"#9CA3AF",fontSize:14,padding:40 }}>没有找到相关物品</p>}
            {searchResults.map(item => (
              <button key={item.id} onClick={() => { setSelectedBox(item.boxId); setTab("boxes"); setSearchQuery(""); window.location.hash = `box-${item.boxId}`; }}
                style={{ background:"#fff",border:"1px solid #F3F4F6",borderRadius:14,padding:"12px 14px",display:"flex",alignItems:"center",gap:12,cursor:"pointer",textAlign:"left",width:"100%",boxShadow:"0 1px 3px rgba(0,0,0,0.04)" }}>
                {item.photo ? (
                  <img src={item.photo} alt="" style={{ width:44,height:44,borderRadius:10,objectFit:"cover",flexShrink:0 }} />
                ) : (
                  <div style={{ width:44,height:44,borderRadius:10,background:"#F3F4F6",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0 }}>📷</div>
                )}
                <div style={{ minWidth:0,flex:1 }}>
                  <div style={{ fontSize:15,fontWeight:600,color:"#1F2937" }}>{item.name}</div>
                  <div style={{ fontSize:13,color:"#3B82F6",marginTop:2 }}>在「{item.boxName}」{item.boxLocation ? ` · ${item.boxLocation}` : ""}</div>
                </div>
                <ChevronRight/>
              </button>
            ))}
            {!searchQuery.trim() && <p style={{ textAlign:"center",color:"#D1D5DB",fontSize:14,padding:40 }}>输入关键词搜索物品所在的箱子</p>}
          </div>
        </div>
      )}

      {/* ===== TAB: BACKUP ===== */}
      {tab === "backup" && <BackupView data={data} onExport={exportData} onImport={importData} />}

      {/* ===== MODALS ===== */}
      {showAddBox && <AddBoxModal onClose={() => setShowAddBox(false)} onAdd={addBox} />}
      {showAddItem && currentBox && <AddItemModal onClose={() => setShowAddItem(false)} onAdd={(name, photo) => addItem(currentBox.id, name, photo)} />}
      {showMoveModal && currentBox && (
        <MoveModal items={showMoveModal} boxes={data.boxes.filter(b => b.id !== currentBox.id)}
          onClose={() => setShowMoveModal(null)}
          onMove={(toBoxId) => { moveItems(currentBox.id, showMoveModal.map(i => i.id), toBoxId); setShowMoveModal(null); }} />
      )}
      {confirmDelete && (
        <Confirm message={confirmDelete.type === "box" ? "确定要删除这个箱子吗？" : "确定要删除这个物品吗？"}
          onYes={() => { confirmDelete.type === "box" ? deleteBox(confirmDelete.boxId) : deleteItem(confirmDelete.boxId, confirmDelete.itemId); setConfirmDelete(null); }}
          onNo={() => setConfirmDelete(null)} />
      )}

      {/* ===== BOTTOM TAB BAR ===== */}
      <div style={{ position:"fixed",bottom:0,left:0,right:0,background:"#fff",borderTop:"1px solid #F3F4F6",display:"flex",justifyContent:"space-around",padding:"8px 0 env(safe-area-inset-bottom, 20px)",zIndex:50 }}>
        {[
          { key:"boxes",label:"箱子",icon:<BoxIcon/> },
          { key:"search",label:"搜索",icon:<SearchIcon/> },
          { key:"backup",label:"备份",icon:<BackupIcon/> },
        ].map(t => (
          <button key={t.key} onClick={() => { setTab(t.key); if(t.key!=="boxes") { setSelectedBox(null); window.location.hash=""; } }}
            style={{ background:"none",border:"none",display:"flex",flexDirection:"column",alignItems:"center",gap:3,cursor:"pointer",padding:"4px 20px",color:tab===t.key?"#3B82F6":"#9CA3AF",transition:"color 0.15s",position:"relative" }}>
            {t.icon}
            <span style={{ fontSize:11,fontWeight:tab===t.key?600:400 }}>{t.label}</span>
            {t.key === "backup" && data.changesSinceBackup >= 5 && (
              <div style={{ position:"absolute",top:2,right:12,width:8,height:8,borderRadius:4,background:"#F59E0B" }} />
            )}
          </button>
        ))}
      </div>
    </div>
  );
}

// ===== BOX DETAIL =====
function BoxDetail({ box, allBoxes, onBack, onAddItem, onDeleteItem, onMoveItem, onDeleteBox, onRename, onLocationChange, batchMode, setBatchMode, batchSelected, setBatchSelected, onBatchMove, onViewPhoto, onCopyNfcLink }) {
  const [editing, setEditing] = useState(false);
  const [editName, setEditName] = useState(box.name);
  const [showSettings, setShowSettings] = useState(false);

  const handleRename = () => {
    if (editName.trim() && editName.trim() !== box.name) {
      const ok = onRename(editName.trim());
      if (ok !== false) setEditing(false);
    } else { setEditing(false); setEditName(box.name); }
  };

  return (
    <div>
      <div style={{ padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between" }}>
        <button onClick={onBack} style={{ background:"none",border:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:4,color:"#3B82F6",fontSize:15,fontWeight:500,padding:"4px 0" }}><ArrowLeft/> 返回</button>
        <div style={{ display:"flex",gap:8 }}>
          {!batchMode && box.items.length > 0 && (
            <button onClick={() => setBatchMode(true)} style={{ background:"#F3F4F6",border:"none",borderRadius:8,padding:"6px 12px",fontSize:13,fontWeight:500,cursor:"pointer",color:"#374151" }}>批量移动</button>
          )}
          <button onClick={() => setShowSettings(!showSettings)} style={{ background:"#F3F4F6",border:"none",borderRadius:8,padding:"6px 10px",fontSize:13,cursor:"pointer",color:"#374151" }}>⋯</button>
        </div>
      </div>

      {showSettings && (
        <div style={{ margin:"0 16px 12px",background:"#fff",border:"1px solid #E5E7EB",borderRadius:12,overflow:"hidden" }}>
          <button onClick={() => { setEditing(true); setShowSettings(false); }} style={{ width:"100%",padding:"12px 16px",background:"none",border:"none",borderBottom:"1px solid #F3F4F6",textAlign:"left",fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",gap:8,color:"#374151" }}><EditIcon/> 重命名箱子</button>
          <button onClick={() => { onCopyNfcLink(); setShowSettings(false); }} style={{ width:"100%",padding:"12px 16px",background:"none",border:"none",borderBottom:"1px solid #F3F4F6",textAlign:"left",fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",gap:8,color:"#374151" }}><LinkIcon/> 复制 NFC 链接</button>
          <div style={{ padding:"12px 16px" }}>
            <label style={{ fontSize:12,color:"#9CA3AF",display:"block",marginBottom:6 }}>位置标签</label>
            <select value={box.location||""} onChange={e => onLocationChange(e.target.value)}
              style={{ width:"100%",padding:"8px 12px",borderRadius:8,border:"1px solid #E5E7EB",background:"#F9FAFB",fontSize:14,color:"#374151" }}>
              <option value="">无</option>
              {LOCATIONS.map(l => <option key={l} value={l}>{l}</option>)}
            </select>
          </div>
          <button onClick={() => { onDeleteBox(); setShowSettings(false); }} style={{ width:"100%",padding:"12px 16px",background:"none",border:"none",borderTop:"1px solid #F3F4F6",textAlign:"left",fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",gap:8,color:"#EF4444" }}><TrashIcon/> 删除箱子</button>
        </div>
      )}

      <div style={{ padding:"0 16px 12px" }}>
        {editing ? (
          <div style={{ display:"flex",gap:8 }}>
            <input value={editName} onChange={e => setEditName(e.target.value)} autoFocus onKeyDown={e => e.key === "Enter" && handleRename()}
              style={{ flex:1,padding:"8px 12px",borderRadius:10,border:"1px solid #3B82F6",fontSize:18,fontWeight:700,outline:"none",color:"#1F2937" }} />
            <button onClick={handleRename} style={{ background:"#3B82F6",color:"#fff",border:"none",borderRadius:10,width:40,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer" }}><CheckIcon/></button>
          </div>
        ) : (
          <div>
            <h2 style={{ fontSize:22,fontWeight:800,color:"#111827" }}>{box.name}</h2>
            <p style={{ fontSize:13,color:"#9CA3AF",marginTop:2 }}>{box.items.length} 件物品{box.location ? ` · ${box.location}` : ""}</p>
          </div>
        )}
      </div>

      {batchMode && (
        <div style={{ margin:"0 16px 12px",background:"#EFF6FF",borderRadius:12,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center" }}>
          <span style={{ fontSize:13,color:"#1D4ED8",fontWeight:500 }}>已选 {batchSelected.size} 件</span>
          <div style={{ display:"flex",gap:8 }}>
            <button onClick={onBatchMove} style={{ background:"#3B82F6",color:"#fff",border:"none",borderRadius:8,padding:"6px 14px",fontSize:13,fontWeight:500,cursor:"pointer" }}>移动</button>
            <button onClick={() => { setBatchMode(false); setBatchSelected(new Set()); }} style={{ background:"#fff",color:"#6B7280",border:"1px solid #E5E7EB",borderRadius:8,padding:"6px 14px",fontSize:13,fontWeight:500,cursor:"pointer" }}>取消</button>
          </div>
        </div>
      )}

      <div style={{ padding:"0 16px",display:"flex",flexDirection:"column",gap:8 }}>
        {box.items.length === 0 && <div style={{ textAlign:"center",padding:"48px 20px",color:"#9CA3AF" }}><p style={{ fontSize:14 }}>箱子是空的，点下面的按钮添加物品</p></div>}
        {box.items.map(item => (
          <div key={item.id} style={{
            background:"#fff",border:batchSelected.has(item.id)?"2px solid #3B82F6":"1px solid #F3F4F6",
            borderRadius:14,padding:"10px 12px",display:"flex",alignItems:"center",gap:12,boxShadow:"0 1px 3px rgba(0,0,0,0.04)"
          }}>
            {batchMode && (
              <button onClick={() => { const s = new Set(batchSelected); s.has(item.id)?s.delete(item.id):s.add(item.id); setBatchSelected(s); }}
                style={{ width:24,height:24,borderRadius:7,border:batchSelected.has(item.id)?"none":"2px solid #D1D5DB",background:batchSelected.has(item.id)?"#3B82F6":"#fff",flexShrink:0,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff" }}>
                {batchSelected.has(item.id) && <CheckIcon/>}
              </button>
            )}
            {item.photo ? (
              <img src={item.photo} alt="" onClick={() => onViewPhoto(item.photo)} style={{ width:50,height:50,borderRadius:10,objectFit:"cover",flexShrink:0,cursor:"pointer" }} />
            ) : (
              <div style={{ width:50,height:50,borderRadius:10,background:"#F9FAFB",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0 }}>📷</div>
            )}
            <div style={{ flex:1,minWidth:0 }}>
              <div style={{ fontSize:15,fontWeight:500,color:"#1F2937",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{item.name}</div>
            </div>
            {!batchMode && (
              <div style={{ display:"flex",gap:4,flexShrink:0 }}>
                <button onClick={() => onMoveItem(item)} style={{ background:"#F3F4F6",border:"none",borderRadius:8,width:34,height:34,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:"#6B7280" }}><MoveIcon/></button>
                <button onClick={() => onDeleteItem(item.id)} style={{ background:"#FEF2F2",border:"none",borderRadius:8,width:34,height:34,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:"#EF4444" }}><TrashIcon/></button>
              </div>
            )}
          </div>
        ))}
      </div>

      {!batchMode && (
        <button onClick={onAddItem} style={{ position:"fixed",bottom:88,right:20,width:52,height:52,borderRadius:16,background:"#3B82F6",color:"#fff",border:"none",boxShadow:"0 4px 16px rgba(59,130,246,0.35)",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",zIndex:40 }}><PlusIcon/></button>
      )}
    </div>
  );
}

// ===== ADD BOX MODAL =====
function AddBoxModal({ onClose, onAdd }) {
  const [name, setName] = useState("");
  const [location, setLocation] = useState("");
  const handleAdd = () => { if (!name.trim()) return; const ok = onAdd(name.trim(), location); if (ok !== false) onClose(); };
  return (
    <Modal title="新建箱子" onClose={onClose}>
      <input placeholder="箱子名称（如：客厅-1）" value={name} onChange={e => setName(e.target.value)} autoFocus onKeyDown={e => e.key==="Enter"&&handleAdd()}
        style={{ width:"100%",padding:"12px 16px",borderRadius:12,border:"1px solid #E5E7EB",fontSize:16,marginBottom:12,outline:"none",color:"#1F2937" }} />
      <select value={location} onChange={e => setLocation(e.target.value)}
        style={{ width:"100%",padding:"12px 16px",borderRadius:12,border:"1px solid #E5E7EB",fontSize:16,marginBottom:16,background:"#fff",color:"#1F2937" }}>
        <option value="">选择位置（可选）</option>
        {LOCATIONS.map(l => <option key={l} value={l}>{l}</option>)}
      </select>
      <button onClick={handleAdd} disabled={!name.trim()} style={{ width:"100%",padding:"14px",borderRadius:12,border:"none",background:name.trim()?"#3B82F6":"#E5E7EB",color:name.trim()?"#fff":"#9CA3AF",fontSize:16,fontWeight:600,cursor:name.trim()?"pointer":"default" }}>创建</button>
    </Modal>
  );
}

// ===== ADD ITEM MODAL =====
function AddItemModal({ onClose, onAdd }) {
  const [name, setName] = useState("");
  const [photo, setPhoto] = useState(null);
  const [compressing, setCompressing] = useState(false);
  const fileRef = useRef();
  const handlePhoto = async (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    setCompressing(true);
    const compressed = await compressImage(file);
    setPhoto(compressed);
    setCompressing(false);
  };
  const handleAdd = () => { if (!name.trim()) return; onAdd(name.trim(), photo); setName(""); setPhoto(null); };
  return (
    <Modal title="添加物品" onClose={onClose}>
      <input placeholder="物品名称" value={name} onChange={e => setName(e.target.value)} autoFocus
        style={{ width:"100%",padding:"12px 16px",borderRadius:12,border:"1px solid #E5E7EB",fontSize:16,marginBottom:12,outline:"none",color:"#1F2937" }} />
      <input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={handlePhoto} style={{ display:"none" }} />
      <button onClick={() => fileRef.current?.click()} style={{
        width:"100%",padding:photo?0:"24px 16px",borderRadius:12,border:"2px dashed #E5E7EB",background:"#FAFAFA",cursor:"pointer",
        display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:6,marginBottom:16,overflow:"hidden",position:"relative",minHeight:photo?160:undefined
      }}>
        {photo ? (
          <React.Fragment>
            <img src={photo} alt="" style={{ width:"100%",height:160,objectFit:"cover",borderRadius:10 }} />
            <div style={{ position:"absolute",bottom:8,right:8,background:"rgba(0,0,0,0.5)",color:"#fff",borderRadius:6,padding:"4px 10px",fontSize:12 }}>重拍</div>
          </React.Fragment>
        ) : compressing ? (
          <span style={{ color:"#9CA3AF",fontSize:14 }}>压缩中...</span>
        ) : (
          <React.Fragment><CameraIcon/><span style={{ color:"#9CA3AF",fontSize:14 }}>拍照（可选）</span></React.Fragment>
        )}
      </button>
      <div style={{ display:"flex",gap:10 }}>
        <button onClick={handleAdd} disabled={!name.trim()} style={{ flex:1,padding:"14px",borderRadius:12,border:"none",background:name.trim()?"#3B82F6":"#E5E7EB",color:name.trim()?"#fff":"#9CA3AF",fontSize:16,fontWeight:600,cursor:name.trim()?"pointer":"default" }}>添加并继续</button>
        <button onClick={onClose} style={{ padding:"14px 20px",borderRadius:12,border:"1px solid #E5E7EB",background:"#fff",color:"#374151",fontSize:16,fontWeight:500,cursor:"pointer" }}>完成</button>
      </div>
    </Modal>
  );
}

// ===== MOVE MODAL =====
function MoveModal({ items, boxes, onClose, onMove }) {
  if (boxes.length === 0) return <Modal title="移动物品" onClose={onClose}><p style={{ color:"#9CA3AF",textAlign:"center",padding:20 }}>没有其他箱子可以移动到，请先创建一个新箱子</p></Modal>;
  return (
    <Modal title={`移动 ${items.length} 件物品到...`} onClose={onClose}>
      <div style={{ fontSize:13,color:"#9CA3AF",marginBottom:12 }}>{items.map(i => i.name).join("、")}</div>
      <div style={{ display:"flex",flexDirection:"column",gap:8 }}>
        {boxes.map(box => (
          <button key={box.id} onClick={() => onMove(box.id)} style={{ background:"#fff",border:"1px solid #E5E7EB",borderRadius:12,padding:"14px 16px",display:"flex",alignItems:"center",gap:12,cursor:"pointer",textAlign:"left",width:"100%" }}>
            <div style={{ width:36,height:36,borderRadius:10,background:"#EFF6FF",display:"flex",alignItems:"center",justifyContent:"center",color:"#3B82F6",flexShrink:0 }}><BoxIcon/></div>
            <div><div style={{ fontSize:15,fontWeight:500,color:"#1F2937" }}>{box.name}</div><div style={{ fontSize:13,color:"#9CA3AF" }}>{box.items.length} 件物品{box.location?` · ${box.location}`:""}</div></div>
          </button>
        ))}
      </div>
    </Modal>
  );
}

// ===== BACKUP VIEW =====
function BackupView({ data, onExport, onImport }) {
  const fileRef = useRef();
  const lastBackup = data.lastBackup ? new Date(data.lastBackup).toLocaleString("zh-CN",{month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "从未备份";
  return (
    <div>
      <div style={{ padding:"16px 16px 0" }}><h1 style={{ fontSize:26,fontWeight:800,color:"#111827",letterSpacing:-0.5 }}>数据备份</h1></div>
      <div style={{ padding:16,display:"flex",flexDirection:"column",gap:12 }}>
        <div style={{ background:data.changesSinceBackup>=5?"#FEF3C7":"#ECFDF5",border:`1px solid ${data.changesSinceBackup>=5?"#FDE68A":"#A7F3D0"}`,borderRadius:14,padding:16 }}>
          <div style={{ fontSize:14,fontWeight:600,color:data.changesSinceBackup>=5?"#92400E":"#065F46" }}>{data.changesSinceBackup>=5?"⚠️ 建议备份":"✅ 数据安全"}</div>
          <div style={{ fontSize:13,color:data.changesSinceBackup>=5?"#A16207":"#047857",marginTop:4,lineHeight:1.5 }}>上次备份：{lastBackup}<br/>未备份的改动：{data.changesSinceBackup} 项</div>
        </div>
        <div style={{ background:"#fff",borderRadius:14,border:"1px solid #F3F4F6",padding:16 }}>
          <div style={{ fontSize:14,fontWeight:600,color:"#374151",marginBottom:8 }}>当前数据</div>
          <div style={{ fontSize:13,color:"#6B7280",lineHeight:1.8 }}>箱子数量：{data.boxes.length}<br/>物品总数：{data.boxes.reduce((s,b)=>s+b.items.length,0)}<br/>含照片物品：{data.boxes.reduce((s,b)=>s+b.items.filter(i=>i.photo).length,0)}</div>
        </div>
        <button onClick={onExport} style={{ width:"100%",padding:"16px",borderRadius:14,border:"none",background:"#3B82F6",color:"#fff",fontSize:16,fontWeight:600,cursor:"pointer",boxShadow:"0 2px 8px rgba(59,130,246,0.3)" }}>导出备份（JSON）</button>
        <input ref={fileRef} type="file" accept=".json" onChange={e => { if(e.target.files[0]) onImport(e.target.files[0]); }} style={{ display:"none" }} />
        <button onClick={() => fileRef.current?.click()} style={{ width:"100%",padding:"16px",borderRadius:14,border:"1px solid #E5E7EB",background:"#fff",color:"#374151",fontSize:16,fontWeight:500,cursor:"pointer" }}>从备份恢复</button>
        <p style={{ fontSize:12,color:"#D1D5DB",textAlign:"center",lineHeight:1.6,padding:"8px 0" }}>导出的 JSON 文件建议保存到 iCloud 云盘<br/>包含所有箱子、物品和照片数据</p>
      </div>
    </div>
  );
}

// ===== MOUNT =====
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
